name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test $(go list ./... | grep -v test/multitenant) -count=1 -timeout 60s

      - name: integration tests
        run: go test ./test/multitenant/... -v -count=1 -timeout 180s
