services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firstyr
      POSTGRES_PASSWORD: firstyr
      POSTGRES_DB: firstyr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstyr"]
      interval: 5s
      timeout: 5s
      retries: 10

  firstyr:
    build: .
    ports:
      - "17080:8080"   # gRPC
      - "17081:8081"   # REST (grpc-gateway)
    environment:
      FIRSTYR_BACKEND_TYPE: postgres
      FIRSTYR_BACKEND_POSTGRES_DSN: postgres://firstyr:firstyr@postgres:5432/firstyr?sslmode=disable
      FIRSTYR_AUTH_MODE: none
      FIRSTYR_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
